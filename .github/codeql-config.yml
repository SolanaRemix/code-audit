name: "CyberAi.network Security Configuration"

# Disable default CodeQL setup if using custom configuration
# This file provides additional control over CodeQL analysis

queries:
  - uses: security-and-quality
  - uses: security-extended

# Path filters - customize based on your repository structure
paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/*.min.js'
  - '**/vendor/**'
  - '**/third-party/**'
  - '**/__pycache__/**'
  - '**/*.pyc'

paths:
  - 'src/**'
  - 'lib/**'
  - '.github/scripts/**'

# Additional packs for enhanced security scanning
# Uncomment and customize as needed

# packs:
#   javascript:
#     - codeql/javascript-queries
#     - codeql/javascript-security-extended
#   python:
#     - codeql/python-queries
#     - codeql/python-security-extended
